<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Turret+Road:wght@200;300;400;500;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; }

.intro-viewer { width: 100%; height: 450px; background: #2F55A4; position: absolute; top: 0; left: 0; right: 0; margin: auto; text-align: center; padding: 4rem 3rem; transition: 0.45s ease all 0.1s; transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94 all .1s); }

form { width: 90%; height: 380px; background: #FFFFFF; box-shadow: 0 6px 31px -2px rgba(0, 0, 0, 0.3); position: absolute; bottom: 7em; left: 0; right: 0; padding: 1em; margin: auto; border-radius: 5px; transform: translateY(30px); transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) all 0.1s; text-align: center; z-index: 0; visibility: hidden; opacity: 0; }
    form h3 { color: #333333; }
    form input { width: 100%; padding: 10px 15px; margin: 5px auto; border-radius: 100px; border: none; background: rgba(255, 255, 255, 0.3); outline: none; color: #333333; border: 1px solid #2F55A4; transition: all 0.2s ease; font-family: 'Poppins', sans-serif; }
        form input:focus { box-shadow: 0 4px 24px -1px rgba(22, 42, 90, 0.16); border-color: #FFFFFF; }

.submit { background: #2F55A4; color: #FFFFFF; cursor: pointer; transition: all 0.5s; }
    .submit:hover { background: #FFFFFF; border-color: #2F55A4; color: #333333; font-weight: 500; }
input::placeholder { color: #333333; font-size: 13px; }
footer { position: absolute; bottom: 0.5em; left: 0; right: 0; margin: auto; text-align: center; transition: 0.45s ease all 0.1s; visibility: hidden; opacity: 0; }
    footer p { color: #333333; }

    footer .fa-square-whatsapp { color: #25D366; }

.open-login form { transform: translateY(0px); opacity: 1; transition-delay: 0.15s; visibility: visible; }
