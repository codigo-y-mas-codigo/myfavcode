<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Accesos Frecuentes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .background-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs><circle cx="20" cy="20" r="3" fill="rgba(255,255,255,0.3)" filter="url(%23blur)"/><circle cx="80" cy="30" r="2" fill="rgba(255,255,255,0.2)" filter="url(%23blur)"/><circle cx="60" cy="70" r="4" fill="rgba(255,255,255,0.1)" filter="url(%23blur)"/><circle cx="30" cy="80" r="2.5" fill="rgba(255,255,255,0.2)" filter="url(%23blur)"/></svg>') repeat;
            animation: float 20s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100px); }
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 72px;
            font-weight: 300;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .search-container {
            position: relative;
            margin-bottom: 40px;
        }

        .search-box {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 20px;
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .bookmark {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .bookmark:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .bookmark-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            font-size: 24px;
        }

        .bookmark-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bookmark-title {
            font-size: 14px;
            font-weight: 500;
            color: white;
            margin-bottom: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .bookmark-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
        }

        .bookmark-notes {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            height: 30px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bookmark:hover .delete-btn {
            opacity: 1;
        }

        .add-bookmark {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 40px;
            transition: all 0.3s ease;
        }

        .add-bookmark:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .tag {
            background: rgba(102, 126, 234, 0.8);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
        }

        .tag-input-container {
            position: relative;
        }

        .tag-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }

        .tag-suggestion {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .tag-suggestion:hover {
            background: #f8f9fa;
        }

        .tag-suggestion:last-child {
            border-bottom: none;
        }

        .export-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .export-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .bookmark-tags {
            margin-top: 8px;
        }

        .access-time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        .edit-btn {
            position: absolute;
            top: 5px;
            right: 30px;
            background: rgba(102, 126, 234, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bookmark:hover .edit-btn {
            opacity: 1;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e1e5e9;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d4d9df;
        }

        .no-results {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .logo h1 {
                font-size: 48px;
            }
            
            .bookmarks-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 15px;
            }
            
            .bookmark {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="background-blur"></div>
    
    <button class="export-btn" onclick="exportData()" title="Exportar datos">📊 Exportar</button>
    
    <div class="container">
        <div class="logo">
            <h1>MiAcceso</h1>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" id="searchBox" placeholder="Buscar en tus notas y sitios web...">
            <span class="search-icon">🔍</span>
        </div>

        <div class="bookmarks-grid" id="bookmarksGrid">
            <div class="bookmark add-bookmark" onclick="openModal()">
                <div>+</div>
                <div style="font-size: 12px; margin-top: 10px;">Agregar sitio</div>
            </div>
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            No se encontraron resultados para tu búsqueda
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Agregar Nuevo Sitio</h2>
            <form id="bookmarkForm">
                <div class="form-group">
                    <label for="siteName">Nombre del sitio:</label>
                    <input type="text" id="siteName" required>
                </div>
                
                <div class="form-group">
                    <label for="siteUrl">URL del sitio:</label>
                    <input type="url" id="siteUrl" placeholder="https://ejemplo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="siteTags">Etiquetas (separadas por comas):</label>
                    <div class="tag-input-container">
                        <input type="text" id="siteTags" placeholder="programación, trabajo, herramientas">
                        <div class="tag-suggestions" id="tagSuggestions"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="siteNotes">Notas:</label>
                    <textarea id="siteNotes" placeholder="Agregar notas sobre este sitio (opcional)"></textarea>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Datos almacenados en memoria (durante la sesión)
        let bookmarks = [];
        let editingIndex = -1;
        const allTags = new Set();

        function saveBookmarks() {
            // En un entorno real, aquí usarías localStorage:
            // localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            console.log('Datos guardados en memoria:', bookmarks);
        }

        function updateAllTags() {
            allTags.clear();
            bookmarks.forEach(bookmark => {
                if (bookmark.tags) {
                    bookmark.tags.forEach(tag => allTags.add(tag));
                }
            });
        }

        function formatTime(date) {
            return new Date(date).toLocaleTimeString('es-ES', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch {
                return '🌐';
            }
        }

        function formatDate(date) {
            return new Date(date).toLocaleDateString('es-ES', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            });
        }

        function createBookmarkElement(bookmark, index) {
            const bookmarkDiv = document.createElement('div');
            bookmarkDiv.className = 'bookmark';
            bookmarkDiv.onclick = () => openSite(bookmark.url, index);
            
            const faviconUrl = getFaviconUrl(bookmark.url);
            const isEmoji = faviconUrl.length === 2; // Simple emoji detection
            
            const tagsHtml = bookmark.tags && bookmark.tags.length > 0 
                ? `<div class="bookmark-tags tags-container">${bookmark.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>`
                : '';
            
            bookmarkDiv.innerHTML = `
                <button class="delete-btn" onclick="event.stopPropagation(); deleteBookmark(${index})" title="Eliminar">×</button>
                <button class="edit-btn" onclick="event.stopPropagation(); editBookmark(${index})" title="Editar">✏️</button>
                <div class="bookmark-icon">
                    ${isEmoji ? faviconUrl : `<img src="${faviconUrl}" alt="${bookmark.name}" onerror="this.parentElement.innerHTML='🌐'">`}
                </div>
                <div class="bookmark-title">${bookmark.name}</div>
                <div class="bookmark-date">Último: ${formatDate(bookmark.lastAccess)}</div>
                <div class="access-time">${formatTime(bookmark.lastAccess)}</div>
                ${tagsHtml}
                <div class="bookmark-notes">${bookmark.notes || ''}</div>
            `;
            
            return bookmarkDiv;
        }

        function renderBookmarks(bookmarksToRender = bookmarks) {
            const grid = document.getElementById('bookmarksGrid');
            const noResults = document.getElementById('noResults');
            
            // Clear existing bookmarks but keep the add button
            const addButton = grid.querySelector('.add-bookmark');
            grid.innerHTML = '';
            grid.appendChild(addButton);
            
            if (bookmarksToRender.length === 0) {
                noResults.style.display = document.getElementById('searchBox').value ? 'block' : 'none';
                return;
            }
            
            noResults.style.display = 'none';
            
            // Sort by last access date (most recent first)
            const sortedBookmarks = [...bookmarksToRender].sort((a, b) => 
                new Date(b.lastAccess) - new Date(a.lastAccess)
            );
            
            sortedBookmarks.forEach((bookmark, originalIndex) => {
                const actualIndex = bookmarks.findIndex(b => 
                    b.url === bookmark.url && b.name === bookmark.name
                );
                const bookmarkElement = createBookmarkElement(bookmark, actualIndex);
                grid.appendChild(bookmarkElement);
            });
        }

        function openSite(url, index) {
            // Update last access date
            bookmarks[index].lastAccess = new Date().toISOString();
            saveBookmarks();
            renderBookmarks();
            
            // Open the site
            window.open(url, '_blank');
        }

        function deleteBookmark(index) {
            if (confirm('¿Estás seguro de que quieres eliminar este sitio?')) {
                bookmarks.splice(index, 1);
                saveBookmarks();
                renderBookmarks();
            }
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('siteName').focus();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('bookmarkForm').reset();
            document.getElementById('tagSuggestions').style.display = 'none';
            
            // Reset modal state
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'Agregar Nuevo Sitio';
            document.getElementById('submitBtn').textContent = 'Guardar';
        }

        function addBookmark(name, url, notes, tags) {
            const bookmark = {
                name,
                url,
                notes,
                tags: tags || [],
                lastAccess: new Date().toISOString(),
                createdAt: new Date().toISOString()
            };
            
            bookmarks.push(bookmark);
            updateAllTags();
            saveBookmarks();
            renderBookmarks();
        }

        function editBookmark(index) {
            editingIndex = index;
            const bookmark = bookmarks[index];
            
            document.getElementById('modalTitle').textContent = 'Editar Sitio';
            document.getElementById('submitBtn').textContent = 'Actualizar';
            document.getElementById('siteName').value = bookmark.name;
            document.getElementById('siteUrl').value = bookmark.url;
            document.getElementById('siteNotes').value = bookmark.notes || '';
            document.getElementById('siteTags').value = bookmark.tags ? bookmark.tags.join(', ') : '';
            
            openModal();
        }

        function updateBookmark(index, name, url, notes, tags) {
            bookmarks[index] = {
                ...bookmarks[index],
                name,
                url,
                notes,
                tags: tags || [],
                lastModified: new Date().toISOString()
            };
            
            updateAllTags();
            saveBookmarks();
            renderBookmarks();
        }

        function exportData() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = String(now.getFullYear()).slice(-2);
            
            const filename = `site-lamp-${day}-${month}-${year}.json`;
            
            const dataStr = JSON.stringify(bookmarks, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = filename;
            link.click();
            
            console.log(`Datos exportados como: ${filename}`);
        }

        function searchBookmarks(query) {
            if (!query.trim()) {
                renderBookmarks();
                return;
            }
            
            const lowercaseQuery = query.toLowerCase();
            const filtered = bookmarks.filter(bookmark => 
                bookmark.name.toLowerCase().includes(lowercaseQuery) ||
                bookmark.notes.toLowerCase().includes(lowercaseQuery) ||
                bookmark.url.toLowerCase().includes(lowercaseQuery) ||
                (bookmark.tags && bookmark.tags.some(tag => 
                    tag.toLowerCase().includes(lowercaseQuery)
                ))
            );
            
            renderBookmarks(filtered);
        }

        function parseTags(tagsString) {
            return tagsString.split(',')
                .map(tag => tag.trim())
                .filter(tag => tag.length > 0);
        }

        function showTagSuggestions(input) {
            const suggestions = document.getElementById('tagSuggestions');
            const currentValue = input.toLowerCase();
            
            if (currentValue.length < 2) {
                suggestions.style.display = 'none';
                return;
            }
            
            const matching = Array.from(allTags).filter(tag => 
                tag.toLowerCase().includes(currentValue) && 
                tag.toLowerCase() !== currentValue
            );
            
            if (matching.length === 0) {
                suggestions.style.display = 'none';
                return;
            }
            
            suggestions.innerHTML = matching.map(tag => 
                `<div class="tag-suggestion" onclick="selectTag('${tag}')">${tag}</div>`
            ).join('');
            
            suggestions.style.display = 'block';
        }

        function selectTag(tag) {
            const input = document.getElementById('siteTags');
            const currentTags = input.value.split(',').map(t => t.trim());
            currentTags[currentTags.length - 1] = tag;
            input.value = currentTags.join(', ') + ', ';
            document.getElementById('tagSuggestions').style.display = 'none';
            input.focus();
        }

        // Event listeners
        document.getElementById('bookmarkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('siteName').value.trim();
            const url = document.getElementById('siteUrl').value.trim();
            const notes = document.getElementById('siteNotes').value.trim();
            const tagsString = document.getElementById('siteTags').value.trim();
            const tags = parseTags(tagsString);
            
            if (name && url) {
                if (editingIndex >= 0) {
                    updateBookmark(editingIndex, name, url, notes, tags);
                } else {
                    addBookmark(name, url, notes, tags);
                }
                closeModal();
            }
        });

        document.getElementById('searchBox').addEventListener('input', function() {
            searchBookmarks(this.value);
        });

        document.getElementById('siteTags').addEventListener('input', function() {
            const lastTag = this.value.split(',').pop().trim();
            showTagSuggestions(lastTag);
        });

        document.getElementById('siteTags').addEventListener('blur', function() {
            setTimeout(() => {
                document.getElementById('tagSuggestions').style.display = 'none';
            }, 200);
        });

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchBox').focus();
            }
        });

        // Add some demo data
        if (bookmarks.length === 0) {
            bookmarks = [
                {
                    name: "GitHub",
                    url: "https://github.com",
                    notes: "Repositorios de código y proyectos",
                    tags: ["programación", "código", "repositorios"],
                    lastAccess: new Date().toISOString(),
                    createdAt: new Date().toISOString()
                },
                {
                    name: "Stack Overflow",
                    url: "https://stackoverflow.com",
                    notes: "Soluciones a problemas de programación",
                    tags: ["programación", "ayuda", "comunidad"],
                    lastAccess: new Date(Date.now() - 86400000).toISOString(), // Yesterday
                    createdAt: new Date().toISOString()
                },
                {
                    name: "MDN Web Docs",
                    url: "https://developer.mozilla.org",
                    notes: "Documentación web y tutoriales",
                    tags: ["documentación", "web", "javascript"],
                    lastAccess: new Date(Date.now() - 172800000).toISOString(), // 2 days ago
                    createdAt: new Date().toISOString()
                }
            ];
            updateAllTags();
            saveBookmarks();
        }

        // Initial render
        renderBookmarks();
    </script>
</body>
</html>
