<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Dulces v4 (Registro Detallado)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px; /* Añadido padding para pantallas pequeñas */
            box-sizing: border-box; /* Asegura que el padding no cause desbordamiento */
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .counter {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Ajustado minwidth para acomodar campos */
            gap: 20px;
            margin-top: 20px;
        }
        .candy {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* Sutil sombra para cada tarjeta */
        }
        button {
            font-size: 14px; /* Ajustado para mejor legibilidad en espacios reducidos */
            padding: 8px 15px; /* Ajustado padding */
            margin: 5px 0; /* Ajustado margen */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            width: 100%; /* Botón al 100% del ancho del candy */
            box-sizing: border-box;
        }
        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        .count {
            font-size: 28px; /* Ligeramente más grande */
            font-weight: bold;
            margin: 10px 0;
            color: #555;
        }
        .add-candy-form { /* Estilos para el formulario dentro de cada dulce */
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Espacio entre los campos del formulario */
        }
        .add-candy-form input,
        .add-candy-form textarea {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box; /* Incluye padding y borde en el ancho total */
            font-size: 14px;
        }
        .add-candy-form input:focus,
        .add-candy-form textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 3px rgba(0, 123, 255, 0.25);
        }
        #newCandyForm {
            margin-top: 30px; /* Más espacio para separar */
            padding-top: 20px;
            border-top: 1px solid #eee; /* Separador visual */
        }
        #newCandyForm input {
            width: calc(100% - 130px); /* Ancho ajustado para el botón */
            display: inline-block;
            margin-right: 10px;
        }
        #newCandyForm button {
            width: 120px; /* Ancho fijo para el botón de añadir nuevo tipo */
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            vertical-align: middle;
        }
        #newCandyForm button:hover {
            background-color: #0056b3;
        }

        .history {
            margin-top: 15px; /* Más espacio */
            max-height: 120px; /* Ligeramente más alto */
            overflow-y: auto;
            text-align: left;
            border: 1px solid #eee; /* Borde más sutil */
            background-color: #fafafa;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px; /* Más pequeño para el historial */
            color: #666;
            width: 100%;
            box-sizing: border-box;
        }
        .history div {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #eee; /* Línea de separación sutil */
        }
        .history div:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .history strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registro de Dulces</h1>
        <div class="counter" id="candyCounter">
            <!-- Los contadores de dulces se agregarán aquí dinámicamente -->
        </div>
        <div id="newCandyForm">
            <input type="text" id="newCandyColor" placeholder="Color del dulce">
            <button onclick="addNewCandy()">Añadir Nuevo Tipo de Dulce</button>
        </div>
    </div>

    <!-- NOTA: El modal (V5) y la persistencia (V6) se han ELIMINADO de esta versión. -->

    <script>
        // Datos iniciales de los dulces (sin persistencia en V4)
        const candies = {
            morado: { count: 0, color: '#8e44ad', history: [] },
            naranja: { count: 0, color: '#e67e22', history: [] },
            verde: { count: 0, color: '#2ecc71', history: [] }
        };

        function createCandyCounter(color) {
            const candy = document.createElement('div');
            candy.className = 'candy';
            candy.innerHTML = `
                <h3>Dulces ${color.charAt(0).toUpperCase() + color.slice(1)}</h3>
                <p class="count" id="${color}Count">${candies[color].count}</p>
                <form class="add-candy-form" onsubmit="event.preventDefault(); addCandyDetail('${color}')">
                    <input type="date" id="date-${color}" required>
                    <input type="text" id="place-${color}" placeholder="Lugar (ej. Casa, Oficina)" required>
                    <textarea id="description-${color}" placeholder="Descripción (ej. Con chocolate, pequeño)" rows="2"></textarea>
                    <button type="submit" style="background-color: ${candies[color].color}; color: white;">Añadir Dulce</button>
                </form>
                <div class="history" id="${color}History"></div>
            `;
            document.getElementById('candyCounter').appendChild(candy);
            updateCandyDisplay(color);
        }

        function addCandyDetail(color) {
            const dateInput = document.getElementById(`date-${color}`);
            const placeInput = document.getElementById(`place-${color}`);
            const descriptionInput = document.getElementById(`description-${color}`);

            const date = dateInput.value;
            const place = placeInput.value;
            const description = descriptionInput.value;

            if (!date || !place) {
                alert('La fecha y el lugar son obligatorios para registrar el dulce.');
                return;
            }

            candies[color].count++;
            candies[color].history.unshift({ date, place, description }); // Añadir al principio para el más reciente

            updateCandyDisplay(color);

            // Reiniciar los campos del formulario específico
            dateInput.value = '';
            placeInput.value = '';
            descriptionInput.value = '';
        }

        function updateCandyDisplay(color) {
            document.getElementById(`${color}Count`).textContent = candies[color].count;
            const historyElement = document.getElementById(`${color}History`);
            historyElement.innerHTML = candies[color].history.map(item =>
                `<div><strong>${item.date}</strong> - ${item.place}${item.description ? `: ${item.description}` : ''}</div>`
            ).join('');
        }

        function addNewCandy() {
            const colorInput = document.getElementById('newCandyColor');
            const color = colorInput.value.toLowerCase().trim(); // Limpiar espacios y convertir a minúsculas
            if (color && !candies[color]) {
                candies[color] = { count: 0, color: getRandomColor(), history: [] };
                createCandyCounter(color);
                colorInput.value = ''; // Limpiar el input después de añadir
            } else if (candies[color]) {
                alert(`El tipo de dulce "${color}" ya existe.`);
            } else {
                alert('Por favor, introduce un color válido para el dulce.');
            }
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Inicializar la aplicación creando los contadores existentes al cargar la página
        for (let color in candies) {
            createCandyCounter(color);
        }
    </script>
</body>
</html>
