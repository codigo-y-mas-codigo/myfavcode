  <!DOCTYPE html>
<html>

<head>
 <title>Tarjeta de Presentación</title>
 <style>
  .card {
   width: 300px;
   height: 200px;
   background-color: #f2f2f2;
   border-radius: 10px;
   padding: 20px;
   box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

  .name {
   font-size: 24px;
   font-weight: bold;
   margin-bottom: 10px;
  }

  .title {
   font-size: 18px;
   color: #888;
   margin-bottom: 10px;
  }

  .contact {
   font-size: 16px;
  }
 </style>
</head>

<body>
 <div class="card">
  <div class="name">Nombre Apellido</div>
  <div class="title">Título del puesto</div>
  <div class="contact">
   Teléfono: 123-456-7890<br>
   Correo electrónico: correo@example.com
  </div>
 </div>
</body>

</html>
