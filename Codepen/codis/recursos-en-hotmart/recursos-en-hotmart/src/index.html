<script>
 // Función para alternar el estado de favorito de un producto
 function toggleFavorite(productId) {
  let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
  if (favorites.includes(productId)) {
   favorites = favorites.filter(id => id !== productId);
  } else {
   favorites.push(productId);
  }
  localStorage.setItem('favorites', JSON.stringify(favorites));
  updateFavoritesSection();
 }
 // Función para actualizar la sección de favoritos
 function updateFavoritesSection() {
  const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
  const favoritesSection = document.getElementById('favorites-section');
  favoritesSection.innerHTML = ''; // Limpiar la sección de favoritos
  favorites.forEach(productId => {
   const productElement = document.querySelector(`[data-id="${productId}"]`);
   if (productElement) {
    const clone = productElement.cloneNode(true);
    favoritesSection.appendChild(clone);
   }
  });
 }
 // Cargar los favoritos al cargar la página
 document.addEventListener('DOMContentLoaded', updateFavoritesSection);
</script>
