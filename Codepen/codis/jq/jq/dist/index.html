  .slick-list:focus {

  .slick-list.dragging {

  .slick-slider .slick-track,
  .slick-slider .slick-list {
   -webkit-transform: translate3d(0, 0, 0);

 <style>
  html,
  body {
   width: 100%;
   height: 100%;
   background-color: #F2F2F2;
  }

  * {
   box-sizing: border-box;
   outline: none;
  }

  .transparent-modal {
   position: fixed;
   top: 0;
   left: 0;
   bottom: 0;
   right: 0;
   opacity: 0;
   background-color: transparent;
   visibility: hidden;
   display: flex;
   justify-content: center;
   align-items: center;
   padding: 10px;
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  @media (max-width: 786px) {
   .transparent-modal {
    padding: 0;
   }
  }

  .transparent-modal.active {
   opacity: 1;
   visibility: visible;
  }

  .transparent-modal.active .wizard-container {
   transform: translateY(0%);
  }

  .transparent-modal .wizard-container {
   position: relative;
   top: 0;
   left: 0;
   background-color: #fff;
   border-radius: 15px;
   box-shadow: 0 10px 20px rgba(204, 204, 204, 0.6);
   overflow: hidden;
   width: 100%;
   height: 529px;
   white-space: nowrap;
   transform: translateY(-10%);
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  @media (max-width: 786px) {
   .transparent-modal .wizard-container {
    height: 100%;
    border-radius: 0;
   }

   .transparent-modal .wizard-container:before {
    bottom: 0% !important;
   }
  }

  .transparent-modal .wizard-container:before {
   content: '';
   position: absolute;
   left: 50%;
   bottom: -53%;
   transform: translate(-50%, 15%) scale(1.2);
   background-color: rgba(33, 150, 243, 0.05);
   width: 700px;
   height: 700px;
   border-radius: 50%;
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  .transparent-modal .wizard-container.stepTwo:before {
   background-color: rgba(42, 186, 103, 0.05);
  }

  .transparent-modal .wizard-container.finalStep:before {
   background-color: #2196F3;
   transform: translate(-50%, -50%) scale(1.2);
   width: 100px;
   height: 100px;
   top: 50%;
   bottom: unset;
   -webkit-animation: bubbleZoom 440ms cubic-bezier(0.4, 0, 0.2, 1) 270ms forwards;
   animation: bubbleZoom 440ms cubic-bezier(0.4, 0, 0.2, 1) 270ms forwards;
  }

  .transparent-modal .wizard-container.finalStep .wizard-callout-body {
   color: #fff;
  }

  .transparent-modal .wizard-container.finalStep .wizard-callout-body .modal-heading:after {
   background-color: rgba(255, 255, 255, 0.15);
  }

  .transparent-modal .wizard-container.finalStep .wizard-controls a {
   color: #fff;
  }

  .transparent-modal .wizard-container.finalStep .wizard-controls .pagination li {
   background-color: rgba(255, 255, 255, 0.54);
  }

  .transparent-modal .wizard-container.finalStep .wizard-controls .pagination li:hover {
   background-color: rgba(255, 255, 255, 0.8);
  }

  .transparent-modal .wizard-container.finalStep .wizard-controls .pagination li.slick-active {
   pointer-events: none;
   background-color: #fff;
   width: 10px;
   height: 10px;
  }

  .transparent-modal .wizard-slide-container {
   transform: translateX(0px);
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
   font-size: 0;
  }

  .transparent-modal .wizard-callout-body {
   display: inline-block;
   width: 100%;
   text-align: center;
   color: #404040;
   white-space: normal;
   font-size: 16px;
  }

  .transparent-modal .wizard-callout-body .modal-heading {
   position: relative;
   text-transform: uppercase;
   font-weight: 800;
   line-height: 2;
   font-size: 2em;
   margin-top: 0;
  }

  .transparent-modal .wizard-callout-body .modal-heading:after {
   content: '';
   position: absolute;
   top: 100%;
   left: 50%;
   transform: translateX(-50%);
   height: 4px;
   width: 70px;
   background-color: rgba(64, 64, 64, 0.15);
  }

  .transparent-modal .wizard-callout-body .desc {
   margin: 0 auto;
   max-width: 55%;
   font-weight: 600;
   line-height: 1.3;
  }

  .transparent-modal .wizard-callout-body .help-animation {
   display: inline-block;
   width: 100%;
  }

  .transparent-modal .wizard-callout-body .help-animation span {
   position: relative;
   display: inline-block;
   width: 100%;
   height: 0;
   padding-bottom: 60%;
   margin-bottom: -5px;
   overflow: hidden;
  }

  .transparent-modal .wizard-controls {
   position: absolute;
   bottom: 0;
   left: 50%;
   transform: translateX(-50%);
   width: 100%;
   display: flex;
   justify-content: space-between;
   align-items: center;
   padding: 10px 20px;
  }

  .transparent-modal .wizard-controls a {
   text-decoration: none;
   text-transform: uppercase;
   font-weight: 600;
   font-size: 1.3em;
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  .transparent-modal .wizard-controls a i {
   font-size: 0.7em;
   vertical-align: 1px;
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  .transparent-modal .wizard-controls a.skip-wizard {
   color: rgba(64, 64, 64, 0.54);
  }

  .transparent-modal .wizard-controls a.skip-wizard:hover {
   color: #404040;
  }

  .transparent-modal .wizard-controls a.skip-wizard.disable {
   opacity: 0;
   pointer-events: none;
  }

  .transparent-modal .wizard-controls a.next-step {
   color: #2196F3;
   order: 2;
  }

  .transparent-modal .wizard-controls a.next-step:hover i {
   transform: translateX(2px);
  }

  .transparent-modal .wizard-controls .pagination {
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   font-size: 0;
  }

  .transparent-modal .wizard-controls .pagination li {
   cursor: pointer;
   display: inline-block;
   vertical-align: middle;
   background-color: rgba(64, 64, 64, 0.54);
   width: 7px;
   height: 7px;
   border-radius: 50%;
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  .transparent-modal .wizard-controls .pagination li button {
   background: none;
   border: none;
   outline: none;
  }

  .transparent-modal .wizard-controls .pagination li+li {
   margin-left: 10px;
  }

  .transparent-modal .wizard-controls .pagination li:hover {
   background-color: rgba(64, 64, 64, 0.8);
  }

  .transparent-modal .wizard-controls .pagination li.slick-active {
   pointer-events: none;
   background-color: #2196F3;
   width: 10px;
   height: 10px;
  }

  .modal-size-sm {
   max-width: 400px;
  }

  .modal-size-md {
   max-width: 700px;
  }

  .modal-size-lg {
   max-width: 1100px;
  }

  @media (max-width: 786px) {
   div[class^="modal-size-"] {
    max-width: 100%;
   }
  }

  #modalLaunch {
   cursor: pointer;
   color: #414141;
   background-color: #d1e690;
   border-radius: 4px;
   padding: 20px 40px;
   font-weight: 800;
   font-size: 2em;
   text-transform: uppercase;
   outline: none;
   border: none;
   box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
   transition: 225ms cubic-bezier(0.4, 0, 0.2, 1) all;
  }

  #modalLaunch:hover {
   box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
  }

  @-webkit-keyframes bubbleZoom {
   0% {
    background-color: #2196F3;
    transform: translate(-50%, -50%) scale(1);
    width: 200px;
    height: 200px;
    top: 50%;
    bottom: unset;
   }

   100% {
    transform: translate(-50%, -50%) scale(10);
   }
  }

  @keyframes bubbleZoom {
   0% {
    background-color: #2196F3;
    transform: translate(-50%, -50%) scale(1);
    width: 200px;
    height: 200px;
    top: 50%;
    bottom: unset;
   }

   100% {
    transform: translate(-50%, -50%) scale(10);
   }
  }
 </style>
