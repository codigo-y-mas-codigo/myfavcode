<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara CSS como Preloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
    }

    /* Navegación */
    nav {
      background: #333;
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    nav button:hover {
      background: #0052a3;
    }

    /* Contenedor principal */
    #content {
      min-height: calc(100vh - 60px);
      padding: 2rem;
      transition: opacity 0.3s ease-in-out;
    }

    #content.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Preloader con la cámara */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #preloader.active {
      display: flex;
    }

    /* Estilos de la cámara CSS */
    .container {
      position: relative;
      border-radius: 5px;
      box-shadow: 0px 30px 50px -20px rgba(0, 0, 0, 0.7);
      animation: 5s angle infinite;
    }

    .camera-top,
    .camera-mid,
    .camera-bottom {
      width: 360px;
    }

    .camera-top {
      height: 60px;
      background: linear-gradient(to right, #e2e2e2 0%, #f5f5f5 10%, #f5f5f5 90%, #e2e2e2 100%);
      border: 1px solid #DCDCDC;
      border-top-left-radius: 5px;
    }

    .camera-top:before {
      display: block;
      content: '';
      position: absolute;
      top: -20px;
      right: 0;
      width: 210px;
      height: 20px;
      background: linear-gradient(to right, #f5f5f5 0%, #f5f5f5 174px, #e2e2e2 100%);
      border: 1px solid #DCDCDC;
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
      border-bottom: none;
      box-shadow: inset 0 15px 15px -15px #FDFDFD;
    }

    .camera-top .zoom {
      position: absolute;
      top: -15px;
      left: 30px;
      width: 42px;
      height: 9px;
      background: linear-gradient(to right, #b0b0b0 0%, #e2e2e2 30%, #e2e2e2 50%, #e2e2e2 70%, #b0b0b0 100%);
      border: 1px solid #A3A3A3;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      box-shadow: inset 0 15px 15px -15px #FDFDFD;
    }

    .camera-top .zoom:before {
      display: block;
      content: '';
      position: relative;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 4px;
      background: linear-gradient(to right, #b0b0b0 0%, #e2e2e2 50%, #b0b0b0 100%);
      border: 1px solid #A3A3A3;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
    }

    .camera-top .zoom:after {
      display: block;
      content: '';
      position: relative;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 4px;
      background: linear-gradient(to right, #b0b0b0 0%, #e2e2e2 30%, #e2e2e2 50%, #e2e2e2 70%, #b0b0b0 100%);
      border: 1px solid #A3A3A3;
      border-bottom: none;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
    }

    .camera-top .mode-changer {
      position: absolute;
      top: -20px;
      left: 82px;
      width: 60px;
      height: 16px;
      background: linear-gradient(to right, #b0b0b0 0%, #e2e2e2 30%, #e2e2e2 50%, #e2e2e2 70%, #b0b0b0 100%);
      border: 1px solid #A3A3A3;
      border-radius: 3px;
      box-shadow: inset 0 15px 15px -15px #FDFDFD;
    }

    .camera-top .mode-changer:after {
      display: block;
      content: '';
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 2px;
      background: linear-gradient(to right, #b0b0b0 0%, #e2e2e2 30%, #e2e2e2 50%, #e2e2e2 70%, #b0b0b0 100%);
      border: 1px solid #A3A3A3;
      border-bottom: none;
    }

    .camera-top .sides {
      width: 100%;
    }

    .camera-top .sides:before,
    .camera-top .sides:after {
      display: block;
      content: '';
      position: absolute;
      top: 24px;
      width: 8px;
      height: 30px;
      background: linear-gradient(to bottom, #828181 0%, #696767 10%, #4f4d4d 50%, #403e3f 100%);
      border: 1px solid #3E3C3D;
      border-radius: 2px;
      box-shadow: 0px 3px 5px -1px rgba(0, 0, 0, 0.5);
    }

    .camera-top .sides:before {
      left: -4px;
      border-top-left-radius: 3px;
      border-bottom-left-radius: 3px;
    }

    .camera-top .sides:after {
      right: -4px;
      border-top-right-radius: 3px;
      border-bottom-right-radius: 3px;
    }

    .camera-top .range-finder {
      position: absolute;
      top: 10px;
      left: 105px;
      width: 30px;
      height: 20px;
      background: #3E3C3D;
      border-radius: 3px;
      box-shadow: inset 0 0 5px 3px #333132;
    }

    .camera-top .range-finder:before {
      display: block;
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #797878;
      border-radius: 100%;
    }

    .camera-top .focus {
      position: absolute;
      top: -14px;
      left: 156px;
      width: 15px;
      height: 15px;
      background: #3F3D3E;
      border-radius: 100%;
      box-shadow: inset 0 0 4px 3px #2D2B2B, inset 0 4px 5px 0 #F5F5F5, inset 0 -3px 4px -2px #A3A2A2;
    }

    .camera-top .red {
      position: absolute;
      top: 5px;
      left: 165px;
      width: 30px;
      height: 30px;
      background: #DC2839;
      border-radius: 100%;
    }

    .camera-top .view-finder {
      position: absolute;
      left: 210px;
      width: 48px;
      height: 30px;
      background: radial-gradient(ellipse at center, #828181 0%, #403e3f 85%, #403e3f 100%);
      border: 3px solid #312F2F;
      border-radius: 4px;
      box-shadow: inset 0 8px 8px -8px #FDFDFD;
    }

    .camera-top .flash {
      position: absolute;
      top: -6px;
      right: 20px;
      width: 58px;
      height: 46px;
      background: radial-gradient(ellipse at center, #828181 0%, #403e3f 70%, #403e3f 100%);
      border: 2px solid #312F2F;
      border-radius: 3px;
      box-shadow: inset 0 8px 8px -8px #FDFDFD;
    }

    .camera-top .flash:before,
    .camera-top .flash:after {
      display: block;
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .camera-top .flash:before {
      width: 90%;
      height: 70%;
      background: radial-gradient(ellipse at center, #696767 0%, #1e1e1e 50%, #1e1e1e 100%);
    }

    .camera-top .flash:after {
      width: 16px;
      height: 14px;
      background: #797979;
      border-top-left-radius: 8px 2px;
      border-top-right-radius: 8px 2px;
      border-bottom-left-radius: 8px 2px;
      border-bottom-right-radius: 8px 2px;
    }

    .camera-top .flash .light {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: radial-gradient(ellipse at center, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 100%;
      z-index: 2;
      animation: 1s flash infinite;
    }

    .camera-mid {
      position: relative;
      height: 130px;
      background: linear-gradient(to right, #e4e4e4 0%, #fafafa 10%, #fafafa 90%, #e4e4e4 100%);
      border: 1px solid #DCDCDC;
      border-top: none;
      border-bottom: none;
      box-shadow: inset 0 15px 15px -15px #FDFDFD;
    }

    .camera-mid .sensor {
      position: absolute;
      top: 40px;
      left: 105px;
      width: 30px;
      height: 30px;
      background: #545252;
      border: 2px solid #545252;
      border-radius: 100%;
      box-shadow: inset 0 12px 12px -10px #FDFDFD, 0 2px 5px 1px rgba(0, 0, 0, 0.3);
    }

    .camera-mid .sensor:before,
    .camera-mid .sensor:after {
      display: block;
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .camera-mid .sensor:before {
      width: 20px;
      height: 20px;
      background: linear-gradient(to bottom, #E9E9E9 0%, #BDBDBD 100%);
      border-radius: 100%;
    }

    .camera-mid .sensor:after {
      width: 12px;
      height: 12px;
      background: #FAFAFA;
      border-radius: 100%;
      box-shadow: 0 2px 3px 0 #747474;
    }

    .camera-mid .lens {
      position: absolute;
      top: -20px;
      left: 130px;
      width: 155px;
      height: 155px;
      background: radial-gradient(ellipse at center, #000000 0%, #000000 15%, #272525 30%, #403e3f 30%, #403e3f 31%, #403e3f 40%, #e9ebec 41%, #e9ebec 44%, #b0b1b2 48%, #e8e9ea 50%, #e8e9ea 60%, #f7f8f8 60%, #787979 65%, #ffffff 66%, #ffffff 100%);
      border: 1px solid #B6B7B8;
      border-radius: 100%;
      box-sizing: border-box;
      box-shadow: 0 7px 15px -2px rgba(0, 0, 0, 0.4), inset 0 -2px 15px -2px rgba(0, 0, 0, 0.2), inset 0 7px 15px -2px #FFF;
    }

    .camera-mid .lens:before {
      display: block;
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25px;
      height: 25px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 100%;
      box-shadow: inset 0 5px 3px -2px rgba(255, 255, 255, 0.5), inset 0 -5px 20px -8px rgba(255, 255, 255, 0.5);
    }

    .camera-bottom {
      height: 16px;
      background: linear-gradient(to right, #e2e2e2 0%, #f5f5f5 10%, #f5f5f5 90%, #e2e2e2 100%);
      border: 1px solid #DCDCDC;
      border-bottom: none;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      box-shadow: inset 0 15px 15px -15px #FDFDFD, inset 0 -12px 12px -10px #797979;
    }

    @keyframes flash {
      0% { width: 0; height: 0; }
      20% { width: 200px; height: 200px; }
      25% { width: 0; height: 0; }
      45% { width: 200px; height: 200px; }
      50% { width: 0; height: 0; }
      100% { width: 0; height: 0; }
    }

    @keyframes angle {
      0% { transform: rotate(0deg); box-shadow: 0px 30px 50px -20px rgba(0, 0, 0, 0.7); }
      25% { transform: rotate(2deg); box-shadow: 10px 30px 50px -20px rgba(0, 0, 0, 0.7); }
      75% { transform: rotate(-2deg); box-shadow: -10px 30px 50px -20px rgba(0, 0, 0, 0.7); }
      100% { transform: rotate(0deg); box-shadow: 0px 30px 50px -20px rgba(0, 0, 0, 0.7); }
    }

    /* Contenido de secciones */
    .section {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .section h1 {
      color: #333;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }

    .section p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <nav>
    <button onclick="loadSection('home')">🏠 Inicio</button>
    <button onclick="loadSection('about')">ℹ️ Sobre</button>
    <button onclick="loadSection('contact')">📧 Contacto</button>
  </nav>

  <div id="preloader">
    <div class='container'>
      <div class='camera-top'>
        <div class='zoom'></div>
        <div class='mode-changer'></div>
        <div class='sides'></div>
        <div class='range-finder'></div>
        <div class='focus'></div>
        <div class='red'></div>
        <div class='view-finder'></div>
        <div class='flash'>
          <div class='light'></div>
        </div>
      </div>
      <div class='camera-mid'>
        <div class='sensor'></div>
        <div class='lens'></div>
      </div>
      <div class='camera-bottom'></div>
    </div>
  </div>

  <div id="content">
    <!-- El contenido se cargará aquí -->
  </div>

  <script>
    // Simular contenido de diferentes secciones
    const sections = {
      home: `
        <div class="section">
          <h1>🏠 Bienvenido</h1>
          <p>Esta es la sección de inicio. La cámara CSS actúa como preloader mientras el contenido se carga.</p>
          <p>Haz clic en los botones de navegación para ver cómo funciona la animación de carga.</p>
          <p>El contenido se carga de forma dinámica sin recargar la página completa. ¡Intenta cambiar entre secciones!</p>
        </div>
      `,
      about: `
        <div class="section">
          <h1>ℹ️ Sobre Nosotros</h1>
          <p>Este ejemplo demuestra cómo usar una animación CSS como preloader mientras se carga contenido dinámicamente.</p>
          <p><strong>Conceptos utilizados:</strong></p>
          <p>✓ Fetch API para cargar contenido<br>
          ✓ Animaciones CSS3<br>
          ✓ Transiciones suaves<br>
          ✓ Lazy loading implícito</p>
          <p>La cámara se muestra durante 1.5 segundos simulando la carga. En una aplicación real, el tiempo dependerá de tu servidor.</p>
        </div>
      `,
      contact: `
        <div class="section">
          <h1>📧 Contacto</h1>
          <p>Puedes adaptar este ejemplo para cargar contenido de un servidor real usando URLs reales en el fetch.</p>
          <p><strong>Cómo funciona:</strong></p>
          <p>1. Haces clic en un botón<br>
          2. Se activa el preloader (cámara animada)<br>
          3. Se simula una carga de 1.5 segundos<br>
          4. Se transiciona suavemente al nuevo contenido</p>
          <p>¡Espero que te sea útil este ejemplo! 📸</p>
        </div>
      `
    };

    // Función para cargar secciones
    function loadSection(section) {
      const contentDiv = document.getElementById('content');
      const preloader = document.getElementById('preloader');

      // Mostrar preloader
      preloader.classList.add('active');
      contentDiv.classList.add('hidden');

      // Simular tiempo de carga (1.5 segundos)
      setTimeout(() => {
        // Cambiar contenido
        contentDiv.innerHTML = sections[section];
        
        // Ocultar preloader y mostrar contenido
        preloader.classList.remove('active');
        contentDiv.classList.remove('hidden');
      }, 1500);
    }

    // Cargar la sección inicial
    loadSection('home');
  </script>

</body>
</html>
