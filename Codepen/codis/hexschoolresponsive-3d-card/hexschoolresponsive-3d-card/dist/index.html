<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>HexSchool - Responsive 3D Card</title>
    <meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <section class="container cardSection">
		<!-- Info -->
		<div class="info">
			<h2 class="info__heading">網頁名片練習</h2>
			<h3 class="info__subHeading">HEX SCHOOL</h3>
		</div>
	
		<!-- Card-Wrapper -->
		<div class="cardWrapper">
			<div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.4">
				<div class="card__content">
					<!-- Texture -->
					<div class="card__texture"></div>
					<!-- logo -->
					<a class="card__logoLink" href="https://www.thegroup.work">
						<svg class="card__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170.08 170.08"><circle cx="85.04" cy="85.04" r="85.04" style="fill:currentColor"/><circle cx="85.04" cy="85.04" r="27.82" style="fill:#fff"/><circle cx="85.04" cy="85.04" r="12.64" style="fill:currentColor"/></svg>

						<svg class="card__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 383.39 175.5"><path d="M0,0H295.64a87.75,87.75,0,0,1,87.75,87.75v0a87.75,87.75,0,0,1-87.75,87.75H87.75A87.75,87.75,0,0,1,0,87.75V0A0,0,0,0,1,0,0Z" transform="translate(383.39 175.5) rotate(-180)" style="fill:currentColor"/><circle cx="262.05" cy="53.91" r="27.82" style="fill:#fff"/><circle cx="250.77" cy="43.28" r="12.64" style="fill:currentColor"/><circle cx="134.82" cy="53.91" r="27.82" style="fill:#fff"/><circle cx="123.54" cy="43.28" r="12.64" style="fill:currentColor"/>
						</svg>
					</a>
					<!-- Person -->
					<div class="card__person">
						<h3 class="card__job">實習生 Intern</h3>
						<h2 class="card__name">王小明</h2>
					</div>
					<!-- Info -->
					<address class="card__info">
						<a href="https://www.tridong.com">三角東東有限公司</a>
						<br>
						<a href="tel:+886-918******">公司電話：09-36361996</a>
						<br>
						<a href="mailto:bottle200919@gmail.com">bottle200919@gmail.com</a>
						<br>
						台中市北區三民路三段 129 號
					</address>
				</div>
			</div>
		</div>
		
</section>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>
