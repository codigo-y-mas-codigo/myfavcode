  <!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Programa de 30 días</title>
 <link rel="stylesheet" href="styles.css">
</head>

<body>
 <div id="app">
  <div class="progress-container">
   <div class="progress-bar" :style="{ width: progressBarWidth }"></div>
  </div>
  <div id="day-content">
   <h1>{{ currentDayText }}</h1>
   <p>{{ currentLessonText }}</p>
   <button @click="prevDay" :disabled="currentDay === 1">Atrás</button>
   <button @click="nextDay">Siguiente</button>
  </div>
  <div id="menu">
   <h2>Selecciona un día:</h2>
   <ul>
    <li v-for="day in 30" :key="day" @click="goToDay(day)">
     Día {{ day }}
    </li>
   </ul>
  </div>
 </div>
 <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
 <script src="script.js"></script>
</body>

</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
