<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galería de imágenes optimizadas</title>
  <style>
    :root { color: #eef7f2; background: #0d1412; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, rgba(72,199,157,.18), transparent 32rem), #0d1412; }
    main { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 42px; }
    header { display: grid; gap: 10px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1; letter-spacing: 0; }
    p { margin: 0; color: #a7b9b2; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    figure { margin: 0; overflow: hidden; border: 1px solid rgba(165,184,176,.16); border-radius: 8px; background: rgba(255,255,255,.045); }
    img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #08100d; }
    figcaption { display: grid; gap: 8px; padding: 12px; }
    strong { color: #f5fff9; overflow-wrap: anywhere; }
    small { color: #a7b9b2; line-height: 1.4; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span { padding: 4px 7px; border-radius: 999px; background: rgba(72,199,157,.14); color: #8ee2c4; font-size: .78rem; font-weight: 700; }
    @media (max-width: 560px) { main { width: min(100% - 20px, 540px); padding-top: 18px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
