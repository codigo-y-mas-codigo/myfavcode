<title>Checkbox</title>
<label class="checkbox-control">
  <input type="checkbox">
  <svg class="checkbox-shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <path class="checkbox-outline" fill="none" stroke="#000" stroke-width="10" d="M88.4 9.9C80.7 2.9 68.6 0 50 0 10 0 0 13.5 0 51.9S10 100 50 100s50-9.6 50-48.1c0-20.5-2.9-34-11.6-42"/>
    <path class="checkbox-check" fill="none" stroke="#000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" d="M32 59l18 18 36-63"/>
  </svg>
  <span class="checkbox-label">Check this custom checkbox</span>
</label>
