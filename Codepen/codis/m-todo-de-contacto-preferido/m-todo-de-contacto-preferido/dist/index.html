  <!DOCTYPE html>
<html lang="es">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Radio Button Circular</title>
 <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
 <style>
  body {
   display: flex;
   align-items: center;
   justify-content: center;
   min-height: 100vh;
   font-family: "Open Sans", sans-serif;
   background: #f5f7fa;
   padding: 20px;
  }

  .radio-group {
   background: white;
   padding: 30px;
   border-radius: 12px;
   box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
   max-width: 400px;
   width: 100%;
  }

  .radio-group h3 {
   margin: 0 0 20px 0;
   color: #223254;
   font-size: 18px;
  }

  .radio-item {
   margin-bottom: 15px;
  }

  .inp-radio {
   display: none;
  }

  .radio-label {
   display: flex;
   align-items: center;
   cursor: pointer;
   padding: 12px;
   border-radius: 8px;
   transition: background 0.2s ease;
   user-select: none;
  }

  .radio-label:hover {
   background: #f8f9fb;
  }

  .radio-circle {
   position: relative;
   width: 22px;
   height: 22px;
   min-width: 22px;
   border-radius: 50%;
   border: 2px solid #9098A9;
   transition: all 0.2s ease;
   margin-right: 12px;
  }

  .radio-circle:before {
   content: "";
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%) scale(0);
   width: 10px;
   height: 10px;
   border-radius: 50%;
   background: #506EEC;
   transition: transform 0.3s ease;
  }

  .radio-circle:after {
   content: "";
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%) scale(0);
   width: 100%;
   height: 100%;
   border-radius: 50%;
   background: #506EEC;
   opacity: 0;
  }

  .radio-text {
   color: #223254;
   font-size: 15px;
   line-height: 1.4;
  }

  .inp-radio:checked+.radio-label .radio-circle {
   border-color: #506EEC;
   animation: wave-radio 0.4s ease;
  }

  .inp-radio:checked+.radio-label .radio-circle:before {
   transform: translate(-50%, -50%) scale(1);
  }

  .inp-radio:checked+.radio-label .radio-circle:after {
   animation: ripple-radio 0.6s ease;
  }

  @keyframes wave-radio {
   50% {
    transform: scale(0.9);
   }
  }

  @keyframes ripple-radio {
   0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.4;
   }

   100% {
    transform: translate(-50%, -50%) scale(2.5);
    opacity: 0;
   }
  }
 </style>
</head>

<body>
 <div class="radio-group">
  <h3>Método de Contacto Preferido</h3>

  <div class="radio-item">
   <input class="inp-radio" id="radio1" type="radio" name="contacto" checked>
   <label class="radio-label" for="radio1">
    <span class="radio-circle"></span>
    <span class="radio-text">Email</span>
   </label>
  </div>

  <div class="radio-item">
   <input class="inp-radio" id="radio2" type="radio" name="contacto">
   <label class="radio-label" for="radio2">
    <span class="radio-circle"></span>
    <span class="radio-text">WhatsApp</span>
   </label>
  </div>

  <div class="radio-item">
   <input class="inp-radio" id="radio3" type="radio" name="contacto">
   <label class="radio-label" for="radio3">
    <span class="radio-circle"></span>
    <span class="radio-text">Llamada Telefónica</span>
   </label>
  </div>

  <div class="radio-item">
   <input class="inp-radio" id="radio4" type="radio" name="contacto">
   <label class="radio-label" for="radio4">
    <span class="radio-circle"></span>
    <span class="radio-text">SMS</span>
   </label>
  </div>
 </div>
</body>

</html>
    
  </body>
  
</html>
