<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gestor de Prompts</title>
 <link rel="stylesheet" href="styles.css">
</head>

<body>
 <div class="container">
  <h1>Gestor de Prompts</h1>
  <div class="controls">
   <button onclick="addPrompt()">Agregar Prompt</button>
   <button onclick="exportData()">Exportar Data</button>
   <button onclick="importData()">Importar Data</button>
  </div>
  <div id="promptList"></div>
  <div id="downloadAlert" class="alert" style="display: none;">
   <p>Descargar Data</p>
   <button onclick="downloadData()">Descargar</button>
  </div>
 </div>
 <script src="script.js"></script>
</body>

</html>
