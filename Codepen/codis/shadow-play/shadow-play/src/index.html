<title>Shadow Play</title>
<canvas id="canvas"></canvas>
<textarea id="codeEditor" class="editor" spellcheck="false" autocorrect="off" autocapitalize="off" translate="no" oninput="render()"></textarea>
<pre id="error"></pre>
<div id="indicator"></div>
<div id="controls">
  <div class="controls">
    <input id="btnToggleView" class="icon" type="checkbox" name="toggleView" onclick="toggleView()">
    <input id="btnToggleResolution" class="icon" type="checkbox" name="toggleResolution" onchange="toggleResolution()">
    <input id="btnReset" class="icon" type="checkbox" name="reset" onclick="reset()">
    <input id="btnPlayStop" class="icon" type="checkbox" name="playStop" onclick="togglePlayStop()">
  </div>
</div>
<script type="x-shader/x-fragment">#version 300 es
/*********
* made by Matthias Hurrle (@atzedent)
*/
precision highp float;
out vec4 O;
uniform float time;
uniform vec2 resolution;
uniform vec2 wheel;
uniform vec2 move;
#define mouse (move/R)
#define FC gl_FragCoord.xy
#define R resolution
#define T (time+wheel.y/MN)
#define N normalize
#define S smoothstep
#define MN min(R.x,R.y)
#define ALP vec3(exp(-1.5*sin(sin(T*1.1177)*1.7)-.3)-1.5,2.5*cos(T*.99978)+.3,exp(-2.*sin(3.*cos(T))-.3)-1.)
#define LP mix(ALP,vec3(exp(-.9*sin(sin(T*1.1177)*1.7)-.3)-1.,2.5*cos(1.3*cos(T*.979))-1.3,(1.2*sin(T*.765))-1.),sin(sin(T*.457)))
#define rot(a) mat2(cos((a)-vec4(0,11,33,0)))
#define hue(a) (.5+.5*sin(3.14*(a)+vec3(1,2,3)))
float rnd(vec3 p) {
	p=fract(p*vec3(12.9898,78.233,156.34));
	p+=dot(p,p+34.56);
	return fract(p.x*p.y*p.z);
}
float box(vec3 p, vec3 s, float r) {
	p=abs(p)-s+r;
	return length(max(p,.0))+min(.0,max(max(p.x,p.y),p.z))-r;
}
float glow;
float map(vec3 p, bool g) {
	float d=5e5;
	if (g) {
		d=length(p-LP)-.05;
		glow+=.05/(.05+d*d*80.);
	}
	d=min(d,-box(p,vec3(12),1e-3));
	float r=3e-3, n=1.;
	vec3 k=vec3(.02,.1,.65);
	p-=clamp(round(p/n),-1.,1.)*n;
	return min(d,min(
		box(p,k,r),
		min(box(p,k.yxz,r),min(box(p,k.xzy,r),box(p,k.zxy,r)))
	));
}
vec3 norm(vec3 p) {
	float h=1e-3; vec2 k=vec2(-1,1);
	return N(
		k.xyy*map(p+k.xyy*h,false)+
		k.yxy*map(p+k.yxy*h,false)+
		k.yyx*map(p+k.yyx*h,false)+
		k.xxx*map(p+k.xxx*h,false)
	);
}
bool march(inout vec3 p, vec3 rd, out float dd, out float i) {
	for (; i++<400.;) {
		float d=map(p,true);
		if (abs(d)<1e-3) return true;
		if (d>100.) return false;
		p+=rd*d;
		dd+=d;
	}
}
float shadow(vec3 p, vec3 lp) {
	float shd=1., maxd=distance(lp,p);
	vec3 l=N(lp-p);
	for (float i=1e-3; i<maxd;) {
		float d=map(p+l*i,false);
		if (d<1e-3) {
			shd=.0;
			break;
		}
		shd=min(shd,1024.*d/i);
		i+=d;
	}
	return shd;
}
float calcAO(vec3 p, vec3 n) {
	float occ=.0, sca=1.;
	for (float i=.0; i<5.; i++) {
		float
		h=.01+i*.03,
		d=map(p+h*n,false);
		occ+=(h-d)*sca;
		sca*=.95;
		if (occ>.35) break;
	}
	return clamp(1.-3.*occ,.0,1.);
}
void cam(inout vec3 p) {
	p.yz*=rot(-move.y*6.3/MN);
	p.xz*=rot(-move.x*6.3/MN);
}
vec3 render(vec2 uv) {
	vec3 col=vec3(0),
	p=vec3(0,0,-10), ro=p,
	rd=N(vec3(uv,2.5));
	cam(rd); cam(p);
	float dd, i;
	if (march(p,rd,dd,i)) {
		vec3 n=norm(p), lp=LP, l=N(lp-p),
		e=N(ro-p), r=reflect(-l,n);
		float ld=distance(lp,p), atten=1./(1.+ld*.25+ld*ld*.125),
		ao=calcAO(p,n), shd=clamp(shadow(p+n*5e-2,lp),.08,1.), ex=ao*shd*atten;
		col+=shd*atten*vec3(.1,.095,.09)+clamp(dot(l,n),.0,1.)*ex;
		col+=pow(max(.0,dot(r,e)),8.)*atten;
		col+=pow(clamp(dot(-rd,l),.0,1.)*ex,32.);
		col+=pow(clamp(dot(reflect(rd,n),l),.0,1.),32.)*vec3(1,.95,.9)*S(.0,1.,clamp(distance(ro,lp),.0,1.))*ex;
	}
	float f=S(1.,.0,clamp(dd/200.,.0,1.)), k=max(.2,1.-distance(LP,p));
	col+=hue(f*f*f*1.57)*k*.25;
	col+=tanh(glow*vec3(1,.5,.4)*mix(.8,1.,rnd(rd)));
	col=tanh(col*col);
	col=sqrt(col);
	return col;
}
void main() {
	vec2 uv=(FC-.5*R)/MN;
	vec3 col=render(uv);
  O=vec4(col,1);
}</script>
