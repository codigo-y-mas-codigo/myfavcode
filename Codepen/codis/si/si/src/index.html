  body {

  .grid {
   display: grid;
   grid-template-columns: repeat(3, 1fr);
   grid-template-rows: repeat(4, 1fr);
   gap: 5px;
   flex-grow: 1;
  }

  .item {
   background-color: #fff;
   border: 2px solid var(--primary-color);
   border-radius: 10px;
   perspective: 1000px;
   cursor: pointer;
  }

  .item-inner {
   position: relative;
   width: 100%;
   height: 100%;
   text-align: center;
   transition: transform 0.6s;
   transform-style: preserve-3d;
  }

  .item.flipped .item-inner {
   transform: rotateY(180deg);
  }

  .item-front,
  .item-back {
   position: absolute;
   width: 100%;
   height: 100%;
   backface-visibility: hidden;
   display: flex;
   flex-direction: column;
   justify-content: center;
   align-items: center;
   padding: 5px;
  }

  .item-back {
   background-color: var(--primary-color);
   color: white;
   transform: rotateY(180deg);
  }

   display: flex;
   justify-content: center;
   align-items: center;
   margin-bottom: 2px;

  }

  .item-text {

   position: fixed;
   z-index: 1;
   left: 0;
   top: 0;

   height: 100%;

    text: "Visitar un centro espacial"
   },

    number: 18,
    icon: "🎭",
    text: "Festival de teatro en Edimburgo"
   }
  ];
  const grid = document.getElementById('grid');
  const modal = document.getElementById('modal');
  let flippedCount = 0;
  let currentAdventures = [];

  function shuffleArray(array) {
   for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
   }
  }

  function createCard(adventure) {
   const item = document.createElement('div');
   item.className = 'item';
   item.innerHTML = `
                <div class="item-inner">
                    <div class="item-front">
                        <div class="item-header">
                            <span class="item-number">${adventure.number}</span>
                            <span class="item-icon">${adventure.icon}</span>
                        </div>
                        <div class="item-text">${adventure.text}</div>
                    </div>
                    <div class="item-back">
                        <span class="item-icon" style="font-size: 40px;">${adventure.icon}</span>
                    </div>
                </div>
            `;
   item.addEventListener('click', () => flipCard(item));
   return item;
  }

  function flipCard(card) {
   if (!card.classList.contains('flipped')) {
    card.classList.add('flipped');
    flippedCount++;
    if (flippedCount === currentAdventures.length) {
     setTimeout(() => {
      modal.style.display = "block";
     }, 1000);
    }
   }
  }

  function resetGame() {
   flippedCount = 0;
   document.querySelectorAll('.item').forEach(item => item.classList.remove('flipped'));
   modal.style.display = "none";
  }

  function newGame() {
   resetGame();
   initializeGame();
  }

  function initializeGame() {
   grid.innerHTML = '';
   currentAdventures = [];
   shuffleArray(adventures);
   for (let i = 0; i < 12; i++) {
    currentAdventures.push(adventures[i]);
   }
   shuffleArray(currentAdventures);
   currentAdventures.forEach(adventure => {
    grid.appendChild(createCard(adventure));
   });
  }

  function rateFeedback(rating) {
   alert(`Gracias por tu valoración: ${rating}`);
  }

  function shareOnTwitter() {
   const text = encodeURIComponent("¡He jugado a la Lotería de Aventuras de Viaje! ¡Inténtalo tú también!");
   const url = encodeURIComponent(window.location.href);
   window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
  }

  function shareOnFacebook() {
   const url = encodeURIComponent(window.location.href);
   window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
  }

  function shareOnInstagram() {
   alert("Para compartir en Instagram, toma una captura de pantalla y súbela a tu historia o feed.");
  }

  function shareOnWhatsApp() {
   const text = encodeURIComponent("¡He jugado a la Lotería de Aventuras de Viaje! Juega aquí: " + window.location.href);
   window.open(`https://wa.me/?text=${text}`, '_blank');
  }
  initializeGame();
  document.addEventListener("DOMContentLoaded", function() {
   const form = document.getElementById("gform");
   const submitButton = document.getElementById("submit-button");
   const buttonText = document.getElementById("button-text");
   const waitMessage = document.getElementById("wait-message");
   const thankYouModal = document.getElementById("thankyouModal");
   const closeThankyouModal = document.getElementById("closeThankyouModal");
   const nombreInput = document.getElementById("nombre");
   const emailInput = document.getElementById("email");
   const recordarDatosCheckbox = document.getElementById("recordarDatos");
   const confirmModal = document.getElementById("confirmModal");
   const confirmYes = document.getElementById("confirmYes");
   const confirmNo = document.getElementById("confirmNo");
   const toast = document.getElementById("toast");
   const formUrlInput = document.getElementById("formUrl");
   // Establecer la URL del formulario
   formUrlInput.value = window.location.href;
   // Recuperar datos del localStorage
   const savedData = JSON.parse(localStorage.getItem("formData"));
   if (savedData) {
    nombreInput.value = savedData.nombre || "";
    emailInput.value = savedData.email || "";
    recordarDatosCheckbox.checked = savedData.recordarDatos || false;
   }
   form.addEventListener("submit", handleFormSubmit);
   recordarDatosCheckbox.addEventListener("change", handleRecordarDatosChange);
   confirmYes.addEventListener("click", handleConfirmYes);
   confirmNo.addEventListener("click", handleConfirmNo);
   closeThankyouModal.addEventListener("click", closeThankyouModalHandler);

   function handleFormSubmit(event) {
    event.preventDefault();
    const data = getFormData(form);
    if (recordarDatosCheckbox.checked) {
     localStorage.setItem("formData", JSON.stringify(data));
    } else {
     localStorage.removeItem("formData");
    }
    setSubmitting(true);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", form.action);
    xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xhr.onreadystatechange = function() {
     if (xhr.readyState === 4) {
      console.log(xhr.status, xhr.statusText);
      console.log(xhr.responseText);
      setSubmitting(false);
      showThankYouModal();
     }
    };
    const encoded = Object.keys(data).map(k =>
     encodeURIComponent(k) + "=" + encodeURIComponent(data[k])
    ).join("&");
    xhr.send(encoded);
   }

   function handleRecordarDatosChange(event) {
    if (!event.target.checked) {
     showConfirmModal();
    }
   }

   function showConfirmModal() {
    confirmModal.style.display = "block";
   }

   function hideConfirmModal() {
    confirmModal.style.display = "none";
   }

   function handleConfirmYes() {
    localStorage.removeItem("formData");
    hideConfirmModal();
    showToast();
   }

   function handleConfirmNo() {
    recordarDatosCheckbox.checked = true;
    hideConfirmModal();
   }

   function showToast() {
    toast.classList.add("show");
    setTimeout(function() {
     toast.classList.remove("show");
    }, 3000);
   }

   function setSubmitting(isSubmitting) {
    submitButton.disabled = isSubmitting;
    buttonText.classList.toggle("hidden", isSubmitting);
    waitMessage.classList.toggle("hidden", !isSubmitting);
   }

   function showThankYouModal() {
    thankYouModal.style.display = "block";
   }

   function closeThankyouModalHandler() {
    thankYouModal.style.display = "none";
   }

   function getFormData(form) {
    const elements = form.elements;
    const fields = Object.keys(elements).filter(k =>
     elements[k].name !== "honeypot"
    ).map(k =>
     elements[k].name !== undefined ? elements[k].name :
     elements[k].length > 0 ? elements[k].item(0).name : null
    ).filter((item, pos, self) =>
     item && self.indexOf(item) == pos
    );
    const formData = {};
    fields.forEach(name => {
     const element = elements[name];
     formData[name] = element.value;
     if (element.length) {
      formData[name] = Array.from(element)
       .filter(item => item.checked || item.selected)
       .map(item => item.value)
       .join(", ");
     }
    });
    formData.formDataNameOrder = JSON.stringify(fields);
    formData.formGoogleSheetName = form.dataset.sheet || "DATA";
    formData.formGoogleSendEmail = form.dataset.email || "luis.el.de.las.tarjetas@gmail.com";
    formData.emailSubject = form.querySelector("#emailSubject").value || "Reseña de Pokelorem";
    return formData;
   }
  });
 </script>
